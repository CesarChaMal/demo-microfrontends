name: Deploy Layout App

on:
  push:
    branches: [main, master]
    paths: ['single-spa-layout-app/**']
  # Manual run: redeploys this app from the Actions tab without a new commit.
  workflow_dispatch:

# One deploy of this app at a time, in the order the runs were started: two runs
# side by side could finish out of order and leave the older build live.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--openssl-legacy-provider"
    defaults:
      run:
        working-directory: single-spa-layout-app
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy from main only
      # A manual run can be started from any branch, and this job publishes to
      # the live site.
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      run: |
        echo "::error::Per-app deploys publish to the live site, so they run from main only (this run is on $GITHUB_REF_NAME)."
        exit 1
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.20.8'
        cache: 'npm'
        cache-dependency-path: single-spa-layout-app/package-lock.json

    - name: Switch to local mode
      run: |
        cd ..
        node scripts/switch-mode.js local

    - name: Configure NPM registry
      run: |
        npm config delete registry || true
        npm config set registry https://registry.npmjs.org/
        npm config list
        echo "Registry: $(npm config get registry)"
        
    - name: Install shared dependencies
      run: |
        cd ../shared
        rm -f package-lock.json
        npm config delete registry || true
        npm config set registry https://registry.npmjs.org/
        npm install --legacy-peer-deps
        
    - name: Install dependencies
      run: |
        rm -f package-lock.json
        npm install --legacy-peer-deps

    - name: Build
      run: |
        export NODE_OPTIONS="--openssl-legacy-provider"
        npm run build:prod
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'eu-central-1' }}
        
    - name: Publish the layout's images to the site root
      # The layout bundle asks for img/<name>.<hash>.<ext> relative to the page,
      # and the site serves those from the bucket root: the full deploy puts
      # them there (the root build copies single-spa-layout-app/dist/img).
      # Without this step a changed image would be missing until the next full
      # deploy. It runs before the bundle goes live and only adds files.
      run: |
        if [ -d dist/img ]; then
          aws s3 sync dist/img/ "s3://$S3_BUCKET/img/"
        else
          echo "This build has no dist/img, nothing to publish."
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}

    - name: Deploy to S3
      run: |
        chmod +x ../scripts/deploy.sh
        ../scripts/deploy.sh layout-app single-spa-layout-app.umd.js
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
        ORG_NAME: ${{ secrets.ORG_NAME }}